<!DOCTYPE html>
<html>

<head>

<title>GlowBeauty Login</title>

<link rel="stylesheet" href="./style.css">

<style>

body{
    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#ff0080,#ff66b3);

    font-family:Arial;
}

.login{
    width:350px;

    background:white;

    padding:40px;

    border-radius:25px;

    box-shadow:0 8px 25px rgba(0,0,0,0.15);

    text-align:center;
}

.login h2{
    color:#e91e63;
    font-size:40px;
    margin-bottom:30px;
}

.login input{
    width:100%;

    padding:15px;

    margin:12px 0;

    border:1px solid #ddd;

    border-radius:12px;

    font-size:16px;

    box-sizing:border-box;
}

.login button{
    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#ff2f7d;

    color:white;

    font-size:18px;

    cursor:pointer;

    margin-top:15px;

    transition:0.3s;
}

.login button:hover{
    background:#e60073;
}

</style>

</head>

<body>

<div class="login">

    <h2>Login</h2>

    <form id="loginForm">

        <input
        type="text"
        name="username"
        placeholder="Username"
        required>

        <input
        type="password"
        name="password"
        placeholder="Password"
        required>

        <button type="submit">
        Login
        </button>

    </form>

</div>

<script>

document.getElementById("loginForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const username =
    document.querySelector("[name='username']").value;

    const password =
    document.querySelector("[name='password']").value;

    const response = await fetch(
    "https://vyshnavi-glow-beauty.onrender.com/login",

    {
        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            username,
            password
        })
    });

    const data = await response.json();

    if(data.success){
        localStorage.setItem("loggedUser", username);

        if(data.role === "admin"){
            localStorage.setItem("adminUser", username);
        }

        window.location.href =
        data.redirect;

    }

    else{

        alert(data.message);

    }

});

</script>

</body>
</html>
